<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>手机互传 · Floating Phrases</title>
  <style>
    :root{--background:#fff;--foreground:#09090b;--primary:#18181b;--primary-foreground:#fafafa;--muted:#f4f4f5;--muted-foreground:#71717a;--border:#e4e4e7;--ring:#a1a1aa;--destructive:#dc2626;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:600px;margin:auto;padding:32px 20px}h1{font-size:28px;line-height:1.2;letter-spacing:-.8px;font-weight:600;margin:0 0 8px}h2{font-size:17px;font-weight:600;letter-spacing:-.3px;margin:0 0 16px}
    p{margin:8px 0;color:var(--muted-foreground)}section{background:var(--background);border:1px solid var(--border);border-radius:12px;padding:22px;margin-top:24px;box-shadow:0 1px 2px #00000005}
    label{display:block;font-weight:500;margin-bottom:10px}button,.download{font:inherit;font-weight:500;border:1px solid transparent;border-radius:6px;padding:9px 16px;min-height:40px;background:var(--primary);color:var(--primary-foreground);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,box-shadow .15s}
    button:hover,.download:hover{background:#27272a}button:disabled{opacity:.45;cursor:default}button.secondary{background:var(--background);border-color:var(--border);color:var(--foreground);margin-top:12px}button.secondary:hover{background:var(--muted)}
    :focus-visible{outline:2px solid var(--ring);outline-offset:3px}input{width:100%;margin:0 0 14px;font:inherit;border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--muted-foreground);background:var(--background)}input::file-selector-button{font:inherit;font-weight:500;border:0;border-radius:4px;background:var(--muted);color:var(--foreground);padding:7px 10px;margin-right:10px;cursor:pointer}
    progress{width:100%;height:6px;accent-color:var(--primary);border:0;border-radius:4px;background:var(--muted);overflow:hidden}progress::-webkit-progress-bar{background:var(--muted)}progress::-webkit-progress-value{background:var(--primary)}progress::-moz-progress-bar{background:var(--primary)}#status{min-height:26px;overflow-wrap:anywhere}#status.error{color:var(--destructive)}
    .file{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding:14px 0}.file:first-child{border:0}
    .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}.name small{display:block;color:var(--muted-foreground);font-weight:400}.download{flex-shrink:0;padding:6px 12px;min-height:34px;background:var(--background);border-color:var(--border);color:var(--foreground)}.download:hover{background:var(--muted)}
    .note{font-size:12px}#cancel[hidden]{display:none}@media(max-width:400px){main{padding:24px 16px}section{padding:18px}}
    body[data-theme="classic"]{--background:#f3f5fb;--foreground:#29344d;--primary:#4462e8;--primary-foreground:#fff;--muted:#edf0fa;--muted-foreground:#65708a;--border:#e0e4ee;--ring:#93a4ff;--destructive:#b93848;font-size:16px}
    body[data-theme="classic"] main{max-width:560px;padding:28px 18px}
    body[data-theme="classic"] h1{font-size:26px;letter-spacing:normal}body[data-theme="classic"] h2{font-size:19px;letter-spacing:normal}
    body[data-theme="classic"] section{background:white;border-radius:16px;padding:20px;margin-top:20px;box-shadow:none}
    body[data-theme="classic"] button,body[data-theme="classic"] .download{border-radius:9px;padding:11px 16px;font-weight:400}
    body[data-theme="classic"] button.secondary{background:var(--muted);color:var(--primary);border-color:transparent}
    body[data-theme="classic"] .download{background:var(--primary);color:var(--primary-foreground);padding:8px 14px}
    body[data-theme="classic"] progress{height:14px}body[data-theme="classic"] .note{font-size:13px}
  </style>
</head>
<body>
<main>
  <h1>手机互传</h1>
  <p>选文件即可传到电脑，电脑分享的文件也能直接下载。</p>
  <section aria-labelledby="upload-title">
    <h2 id="upload-title">发送到电脑</h2>
    <label for="files">选择照片或文件（可多选，单个不超过 2 GiB）</label>
    <input id="files" type="file" multiple>
    <button id="send" disabled>发送到电脑</button>
    <button id="cancel" class="secondary" hidden>取消上传</button>
    <p id="status" role="status" aria-live="polite">文件会保存到电脑的专用接收目录。</p>
    <progress id="progress" value="0" max="100" aria-label="上传进度" hidden></progress>
  </section>
  <section aria-labelledby="download-title">
    <h2 id="download-title">下载到手机</h2>
    <div id="downloads" aria-live="polite">正在读取电脑分享的文件…</div>
    <button id="refresh" class="secondary">刷新文件列表</button>
  </section>
  <p class="note">保持此页面打开，上传期间不要锁屏。下载位置由手机浏览器决定。</p>
  <p class="note">这是局域网 HTTP 连接，请在可信网络使用。电脑关闭互传后，此链接失效。</p>
</main>
<script>
  const base = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
  const picker = document.getElementById('files'), send = document.getElementById('send');
  const cancel = document.getElementById('cancel'), status = document.getElementById('status');
  const progress = document.getElementById('progress'), downloads = document.getElementById('downloads');
  let request = null, stopped = false, busy = false, listing = null;
  function message(text, error = false) { status.textContent = text; status.className = error ? 'error' : ''; }
  function size(bytes) { return bytes < 1024 ? bytes + ' B' : bytes < 1048576 ? (bytes / 1024).toFixed(1) + ' KiB' : (bytes / 1048576).toFixed(1) + ' MiB'; }
  picker.addEventListener('change', () => { send.disabled = busy || !picker.files.length; });
  async function refresh() {
    try {
      const response = await fetch(base + 'files', {cache:'no-store'});
      if (!response.ok) throw new Error();
      document.body.dataset.theme = response.headers.get('X-FloatingPhrases-Theme') || 'shadcn';
      const files = await response.json();
      const signature = JSON.stringify(files);
      if (signature === listing) return;
      listing = signature;
      downloads.replaceChildren();
      if (!files.length) { downloads.textContent = '电脑还没有分享文件，添加后会自动出现在这里。'; return; }
      for (const file of files) {
        const row = document.createElement('div'); row.className = 'file';
        const name = document.createElement('div'); name.className = 'name'; name.textContent = file.name;
        const detail = document.createElement('small'); detail.textContent = size(file.size); name.append(detail);
        const link = document.createElement('a'); link.className = 'download'; link.textContent = '下载';
        link.href = base + 'download/' + encodeURIComponent(file.id); link.setAttribute('download', file.name);
        link.setAttribute('aria-label', '下载 ' + file.name); row.append(name, link); downloads.append(row);
      }
    } catch { listing = null; downloads.textContent = '连接已中断或电脑已关闭互传，请重新扫码。'; }
  }
  function upload(file, index, total) {
    return new Promise((resolve, reject) => {
      request = new XMLHttpRequest();
      request.open('POST', base + 'upload');
      request.setRequestHeader('Content-Type', 'application/octet-stream');
      request.setRequestHeader('X-Transfer-Upload', '1');
      request.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
      request.upload.onprogress = event => {
        progress.value = event.lengthComputable ? event.loaded / event.total * 100 : 0;
        message('正在发送 ' + index + '/' + total + '：' + file.name + (progress.value >= 100 ? ' · 等待电脑保存…' : ''));
      };
      request.onload = () => {
        let result; try { result = JSON.parse(request.responseText); } catch { result = {}; }
        if (request.status >= 200 && request.status < 300) resolve(result);
        else reject(new Error(result.error || (request.status === 413 ? '文件超过 2 GiB，请选择较小文件。' : '发送失败，请检查电脑是否开启互传。')));
      };
      request.onerror = () => reject(new Error('连接中断，请保持同一 Wi-Fi 并重新发送。'));
      request.onabort = () => reject(new Error('已取消；已经发送成功的文件会保留。'));
      request.send(file);
    });
  }
  send.addEventListener('click', async () => {
    const files = Array.from(picker.files);
    if (!files.length || busy) return;
    if (files.some(file => file.size > 2147483648)) { message('单个文件不能超过 2 GiB。', true); return; }
    busy = true; stopped = false; let complete = 0;
    picker.disabled = true; send.disabled = true; cancel.hidden = false; progress.hidden = false; progress.value = 0;
    try {
      for (const file of files) {
        if (stopped) break;
        await upload(file, complete + 1, files.length); complete++;
      }
      message('已发送 ' + complete + ' 个文件，电脑已保存。');
      picker.value = '';
    } catch (error) { message('已完成 ' + complete + '/' + files.length + '。' + error.message, true); }
    finally { request = null; busy = false; picker.disabled = false; send.disabled = !picker.files.length; cancel.hidden = true; progress.hidden = true; }
  });
  cancel.addEventListener('click', () => { stopped = true; if (request) request.abort(); });
  document.getElementById('refresh').addEventListener('click', refresh);
  window.addEventListener('beforeunload', event => { if (busy) { event.preventDefault(); event.returnValue = ''; } });
  refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
